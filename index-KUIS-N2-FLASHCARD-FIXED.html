<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff8f4">
<meta name="description" content="KUIS N2 — JLPT N2 vocabulary">
<link rel="manifest" href="manifest.webmanifest">
<title>KUIS N2</title>
<style>
:root{--bg:#fff8f4;--card:#fff;--ink:#26313d;--muted:#7b8792;--pink:#ef8fa8;--blue:#8bb9d8;--green:#79b693;--cream:#fff1dc;--line:#eee4df;--shadow:0 12px 30px rgba(76,54,55,.08);--r:22px}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff8f4,#f7fbfd);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;min-height:100dvh;margin:auto;padding-bottom:90px}.page{padding:18px 16px 24px}.hero{background:linear-gradient(135deg,#fce5ea,#e7f3fa);border-radius:28px;padding:22px 20px 20px;box-shadow:var(--shadow);overflow:hidden}.hero h1{margin:0;font-size:28px}.hero p{margin:6px 0;color:#687583;font-size:13px}.fuji{height:54px;margin:18px -20px -20px;background:#a7c6d8;clip-path:polygon(0 100%,28% 42%,43% 68%,61% 12%,76% 60%,100% 25%,100% 100%)}.greeting{margin:14px 3px 10px;color:var(--muted);font-size:14px}.card,.progress-card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.progress-row{display:flex;justify-content:space-between;align-items:end}.progress-row strong{font-size:25px}.progress-row span{font-size:12px;color:var(--muted)}.bar{height:9px;background:#f0e8e5;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--blue));border-radius:99px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.action{border:1px solid var(--line);background:#fff;border-radius:20px;padding:17px;text-align:left;min-height:106px;box-shadow:var(--shadow)}.action .ico{font-size:25px}.action b{display:block;margin-top:8px}.action small{display:block;color:var(--muted);margin-top:3px}.quote{text-align:center;margin-top:14px;padding:15px;border-radius:18px;background:var(--cream);font-weight:800;color:#6e5c48}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top h2{margin:0;font-size:21px}.back,.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#fff}.sub{font-size:12px;color:var(--muted);margin:-7px 0 14px 2px}.section-title{font-size:13px;font-weight:800;margin:18px 2px 9px;color:#5e6973}.day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.day,.choice{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 4px;text-align:center}.day.active,.choice.active{border-color:var(--pink);background:#fff0f4;box-shadow:0 0 0 2px rgba(239,143,168,.12)}.day b{display:block}.day small{color:var(--muted);font-size:9px}.mode-grid{display:grid;gap:9px}.choice{text-align:left;padding:13px;border-radius:16px}.choice small{display:block;color:var(--muted);margin-top:3px}.primary,.startbtn{width:100%;border:0;border-radius:16px;padding:14px;background:var(--ink);color:#fff;font-weight:800}.secondary{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff;font-weight:700}.danger{color:#b75b5b}.quiz-head{display:flex;justify-content:space-between}.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 10px;font-size:12px}.quiz-card{background:#fff;border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow);padding:24px 18px}.qmeta{text-align:center;color:var(--muted);font-size:12px}.prompt{text-align:center;font-size:43px;font-weight:900;margin:22px 4px;word-break:break-word}.prompt.meaning{font-size:24px}.answers{display:grid;gap:10px}.answer{border:1px solid #e7e1de;background:#fff;border-radius:16px;padding:14px;text-align:left;min-height:52px}.answer.correct{border-color:#79b693;background:#f1faf4}.answer.wrong{border-color:#df899d;background:#fff1f4}.quiz-tools,.flash-controls{display:flex;gap:9px;margin-top:12px}.quiz-tools>* ,.flash-controls>*{flex:1}.result{text-align:center;margin-top:25px}.score{font-size:54px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}.list-search,.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px}.word{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}.word b{font-size:20px}.word small{display:block;color:var(--muted);margin-top:2px}.meaning{text-align:right;font-size:13px;max-width:48%}
.flash-wrap{perspective:1000px}.flash-card{height:430px;position:relative;transform-style:preserve-3d;transition:transform .45s ease;touch-action:pan-y;user-select:none;cursor:pointer}.flash-card.flipped{transform:rotateY(180deg)}.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}.flash-face-back{transform:rotateY(180deg)}.flash-kanji{font-size:78px;font-weight:900}.flash-reading{font-size:23px;margin-top:10px;color:#697580}.flash-meaning{font-size:25px;font-weight:900}.hint{text-align:center;color:var(--muted);font-size:12px;margin:10px 0}.bottom{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;color:#87919a;padding:6px 1px;font-size:10px}.nav span{display:block;font-size:19px;line-height:20px}.nav.active{color:#d46f89;font-weight:800}.empty{text-align:center;color:var(--muted);padding:28px 8px}.toast{position:fixed;z-index:50;left:50%;bottom:92px;transform:translateX(-50%);background:#26313d;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.small{font-size:11px;color:var(--muted)}.db-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.db-actions button{width:100%}.status{padding:11px;border-radius:14px;background:#f7f8f8;font-size:12px;color:#5e6973;margin-top:10px}.badge{display:inline-block;border-radius:99px;background:#f4edf0;padding:4px 8px;font-size:10px;color:#6d6670}
@media(max-width:380px){.day-grid{grid-template-columns:repeat(4,1fr)}.flash-card{height:390px}}
</style>
</head>
<body>
<main id="app" class="app"></main><div id="toast" class="toast"></div>
<script src="data.js"></script>
<script>
(()=>{"use strict";
const APP=document.getElementById("app"),TOAST=document.getElementById("toast");
const DBKEY="kuisN2_database_v2",PKEY="kuisN2_progress_v2";
const BUILTIN=(window.KANJI_DATA||[]).map(normalize);
function normalize(x,i){return{id:String(x.id??("v"+i)),day:Number(x.day)||0,no:Number(x.no)||i+1,kanji:String(x.kanji??""),reading:String(x.reading??""),meaning:String(x.meaning??"")}}
function loadDB(){try{const x=JSON.parse(localStorage.getItem(DBKEY)||"null");if(Array.isArray(x)&&x.length)return x}catch(e){}return BUILTIN}
function loadJSON(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}
let DB=loadDB(),progress=loadJSON(PKEY,{seen:{},repeat:{},sessions:[]}),quiz=null,timer=null;
let flash={day:1,index:0,flipped:false};
function saveAll(){localStorage.setItem(DBKEY,JSON.stringify(DB));localStorage.setItem(PKEY,JSON.stringify(progress))}
function toast(t){TOAST.textContent=t;TOAST.classList.add("show");setTimeout(()=>TOAST.classList.remove("show"),1600)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function days(){return [...new Set(DB.map(x=>x.day).filter(Boolean))].sort((a,b)=>a-b)}
function words(d){return DB.filter(x=>x.day===Number(d))}
function seenCount(){return Object.values(progress.seen||{}).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0)}
function nav(active){return `<nav class="bottom"><button class="nav ${active==="home"?"active":""}" data-nav="home"><span>⌂</span>Home</button><button class="nav ${active==="quiz"?"active":""}" data-nav="quiz"><span>✎</span>Quiz</button><button class="nav ${active==="flash"?"active":""}" data-nav="flash"><span>◈</span>Flash</button><button class="nav ${active==="list"?"active":""}" data-nav="list"><span>▤</span>単語</button><button class="nav ${active==="db"?"active":""}" data-nav="db"><span>☁</span>DB</button></nav>}
function shell(content,active){APP.innerHTML=content+nav(active);APP.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>show(b.dataset.nav))}
function top(t){return `<div class="top"><button class="back" id="back">‹</button><h2>${t}</h2></div>`}
function home(){let p=seenCount(),pct=DB.length?Math.min(100,p/DB.length*100):0;shell(`<div class="page"><section class="hero"><h1>KUIS N2</h1><p>JLPT N2 Vocabulary · ${DB.length.toLocaleString()} kata</p><div class="fuji"></div></section><div class="greeting">こんにちは 👋 今日も少しずつ進めよう。</div><section class="progress-card"><div class="progress-row"><div><span>学習進捗</span><strong>${p} / ${DB.length}</strong></div><span>${pct.toFixed(1)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></section><div class="actions"><button class="action" id="hq"><div class="ico">📝</div><b>今日のクイズ</b><small>Dayを選択して開始</small></button><button class="action" id="hf"><div class="ico">🃏</div><b>フラッシュカード</b><small>タップでFlip・Swipe</small></button><button class="action" id="hl"><div class="ico">📚</div><b>単語一覧</b><small>Dayごとに確認</small></button><button class="action" id="hp"><div class="ico">📈</div><b>進捗</b><small>学習記録を見る</small></button></div><div class="quote">「継続は力なり」</div></div>`,"home");document.getElementById("hq").onclick=quizMenu;document.getElementById("hf").onclick=()=>flashView();document.getElementById("hl").onclick=listView;document.getElementById("hp").onclick=progressView}
function quizMenu(){let ds=days(),day=ds[0]||1,mode="kr",difficulty="normal",seconds=20,count=10;let html=`<div class="page">${top("Quiz")}<div class="sub">Pilih Day, jenis soal, tingkat kesulitan, timer, dan jumlah soal.</div><div class="section-title">Hari</div><div class="day-grid">${ds.map(d=>`<button class="day ${d===day?"active":""}" data-day="${d}"><b>${d}</b><small>${words(d).length} kata</small></button>`).join("")}</div><div class="section-title">Mode Soal</div><div class="mode-grid"><button class="choice active" data-mode="kr"><b>Kanji → Reading</b><small>Pilih cara baca</small></button><button class="choice" data-mode="rk"><b>Reading → Kanji</b><small>Pilih kanji</small></button><button class="choice" data-mode="km"><b>Kanji → Arti</b><small>Pilih arti</small></button><button class="choice" data-mode="mix"><b>Mix</b><small>Campuran</small></button></div><div class="section-title">Kesulitan</div><div class="mode-grid"><button class="choice active" data-difficulty="normal"><b>🟢 Normal</b><small>Pengecoh umum</small></button><button class="choice" data-difficulty="hard"><b>🔴 Sulit</b><small>Pengecoh reading dibuat semirip mungkin</small></button></div><div class="status" id="difficultyInfo">Normal: fokus mengenali jawaban.</div><div class="section-title">Timer</div><div class="mode-grid"><button class="choice active" data-time="20">20 detik</button><button class="choice" data-time="30">30 detik</button><button class="choice" data-time="60">60 detik</button></div><div class="section-title">Jumlah soal</div><div class="mode-grid"><button class="choice active" data-count="10">10 soal</button><button class="choice" data-count="20">20 soal</button><button class="choice" data-count="50">50 soal</button></div><br><button class="startbtn" id="start">Mulai Quiz →</button></div>`;shell(html,"quiz");
APP.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{day=Number(b.dataset.day);APP.querySelectorAll("[data-day]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
APP.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;APP.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
APP.querySelectorAll("[data-difficulty]").forEach(b=>b.onclick=()=>{difficulty=b.dataset.difficulty;APP.querySelectorAll("[data-difficulty]").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("difficultyInfo").textContent=difficulty==="hard"?"Sulit: reading pengecoh dibuat semirip mungkin.":"Normal: fokus mengenali jawaban."});
APP.querySelectorAll("[data-time]").forEach(b=>b.onclick=()=>{seconds=Number(b.dataset.time);APP.querySelectorAll("[data-time]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
APP.querySelectorAll("[data-count]").forEach(b=>b.onclick=()=>{count=Number(b.dataset.count);APP.querySelectorAll("[data-count]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
document.getElementById("start").onclick=()=>startQuiz(day,mode,difficulty,seconds,count);document.getElementById("back").onclick=home}
function lev(a,b){a=String(a).toLowerCase();b=String(b).toLowerCase();let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[b.length]}
function hiraToKata(s){return String(s).replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)}
function hardReadingScore(correct,candidate){if(candidate===correct)return -999;let a=hiraToKata(correct),b=hiraToKata(candidate),d=lev(a,b),max=Math.max(a.length,b.length,1),score=1-d/max;if(a[0]===b[0])score+=.22;if(a.slice(-1)===b.slice(-1))score+=.1;return score}
function buildOptions(q,mode,difficulty){let correct=mode==="kr"?q.reading:mode==="rk"?q.kanji:q.meaning;let source=DB.filter(x=>String(x.id)!==String(q.id));let pool=[...new Map(source.map(x=>{let v=mode==="kr"?x.reading:mode==="rk"?x.kanji:x.meaning;return[String(v),v]})).values()].filter(v=>String(v)!==String(correct));if(difficulty!=="hard"||mode!=="kr")return shuffle([correct,...shuffle(pool).slice(0,3)]);let ranked=pool.map(v=>({v,score:hardReadingScore(correct,v)})).sort((a,b)=>b.score-a.score);return shuffle([correct,...shuffle(ranked.filter(x=>x.score>=.18).slice(0,14)).slice(0,3).map(x=>x.v)])}
function startQuiz(day,mode,difficulty,seconds,count){let arr=words(day);if(!arr.length){toast("Day ini belum memiliki kosakata");return}let seen=new Set((progress.seen[day]||[]).map(String)),rep=new Set((progress.repeat[day]||[]).map(String)),items=shuffle(arr.filter(x=>!seen.has(String(x.id))));items=[...items,...shuffle(arr.filter(x=>rep.has(String(x.id))))].slice(0,count);if(!items.length)items=shuffle(arr).slice(0,count);items.forEach(x=>seen.add(String(x.id)));progress.seen[day]=[...seen];saveAll();quiz={day,mode,difficulty,seconds,count,items,i:0,score:0,wrong:0,locked:false};renderQuestion()}
function renderQuestion(){clearInterval(timer);if(quiz.i>=quiz.items.length){finishQuiz();return}let q=quiz.items[quiz.i],mode=quiz.mode==="mix"?shuffle(["kr","rk","km"])[0]:quiz.mode;quiz.currentMode=mode;let correct=mode==="kr"?q.reading:mode==="rk"?q.kanji:q.meaning,opts=buildOptions(q,mode,quiz.difficulty);APP.innerHTML=`<div class="page"><div class="quiz-head"><span class="pill">Day ${quiz.day} · ${quiz.i+1}/${quiz.items.length}</span><span class="pill">${quiz.difficulty==="hard"?"🔴 Sulit":"🟢 Normal"}</span><span class="pill">⏱ <b id="clock">${quiz.seconds}</b>s</span></div><div class="bar"><i style="width:${quiz.i/quiz.items.length*100}%"></i></div><br><section class="quiz-card"><div class="qmeta">${mode==="kr"?"読み方は？":mode==="rk"?"漢字は？":"意味は？"}</div><div class="prompt ${mode==="km"?"meaning":""}">${esc(mode==="rk"?q.reading:q.kanji)}</div><div class="answers" id="answers">${opts.map(o=>`<button class="answer" data-answer="${esc(o)}">${esc(o)}</button>`).join("")}</div><div class="quiz-tools"><button class="secondary" id="exit">終了</button></div></section></div>`;document.getElementById("answers").onclick=e=>{let b=e.target.closest("[data-answer]");if(b)answer(b.dataset.answer,correct)};document.getElementById("exit").onclick=()=>{clearInterval(timer);quizMenu()};let left=quiz.seconds;timer=setInterval(()=>{left--;let c=document.getElementById("clock");if(c)c.textContent=left;if(left<=0)answer(null,correct)},1000)}
function answer(value,correct){if(!quiz||quiz.locked)return;quiz.locked=true;clearInterval(timer);let q=quiz.items[quiz.i],ok=value!==null&&value===correct,rep=new Set((progress.repeat[quiz.day]||[]).map(String));if(ok)rep.delete(String(q.id));else{rep.add(String(q.id));quiz.wrong++}quiz.score+=ok?1:0;progress.repeat[quiz.day]=[...rep];let btn=[...document.querySelectorAll(".answer")].find(x=>x.dataset.answer===value);if(btn)btn.classList.add(ok?"correct":"wrong");setTimeout(()=>{quiz.i++;quiz.locked=false;saveAll();renderQuestion()},260)}
function finishQuiz(){clearInterval(timer);let s=quiz;progress.sessions.unshift({day:s.day,score:s.score,total:s.items.length,wrong:s.wrong,date:Date.now()});progress.sessions=progress.sessions.slice(0,100);saveAll();quiz=null;APP.innerHTML=`<div class="page"><div class="result"><div class="pill">Day ${s.day} selesai</div><h2>お疲れさま！</h2><div class="score">${s.score}/${s.items.length}</div><div class="stats"><div class="stat"><b>${s.score}</b><small>正解</small></div><div class="stat"><b>${s.wrong}</b><small>不正解</small></div><div class="stat"><b>${(progress.repeat[s.day]||[]).length}</b><small>復習</small></div></div><button class="primary" id="again">Ulangi Day ${s.day}</button><br><br><button class="secondary" id="qmenu">Quiz Menu</button></div></div>`;document.getElementById("again").onclick=()=>startQuiz(s.day,s.mode,s.difficulty||"normal",s.seconds,s.count);document.getElementById("qmenu").onclick=quizMenu}

/* ===== FLASHCARD: REBUILT CLEANLY ===== */
function flashView(direction=0){
  const ds=days();
  if(!ds.length){toast("Database kosong");return}
  if(!ds.includes(flash.day))flash.day=ds[0];
  const arr=words(flash.day);
  if(!arr.length){toast("Day ini kosong");return}
  if(flash.index<0)flash.index=0;
  if(flash.index>=arr.length)flash.index=0;
  const q=arr[flash.index];
  const enter=direction>0?"flash-enter-left":direction<0?"flash-enter-right":"";
  shell(`<div class="page">${top("Flashcard")}
  <div class="sub">Day ${flash.day} · ${flash.index+1}/${arr.length}</div>
  <div class="day-grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
    <button class="day" id="pd">← Day</button><button class="day" id="nd">Day →</button>
  </div>
  <div class="flash-wrap">
    <div class="flash-card ${flash.flipped?"flipped":""} ${enter}" id="fc">
      <div class="flash-face">
        <div class="qmeta">KANJI</div>
        <div class="flash-kanji">${esc(q.kanji)}</div>
        <div class="flash-reading">${esc(q.reading)}</div>
        <div class="hint">Tap untuk Flip</div>
      </div>
      <div class="flash-face flash-face-back">
        <div class="qmeta">ARTI</div>
        <div class="flash-meaning">${esc(q.meaning)}</div>
        <div class="flash-reading">${esc(q.reading)}</div>
        <div class="hint">Tap lagi untuk kembali</div>
      </div>
    </div>
  </div>
  <div class="hint">← Swipe kiri: berikutnya · Swipe kanan: sebelumnya →</div>
  <div class="flash-controls">
    <button class="secondary" id="prev">← Sebelumnya</button>
    <button class="primary" id="next">Berikutnya →</button>
  </div></div>`,"flash");

  document.getElementById("back").onclick=home;
  document.getElementById("pd").onclick=()=>changeFlashDay(-1);
  document.getElementById("nd").onclick=()=>changeFlashDay(1);
  document.getElementById("prev").onclick=()=>flashMove(-1);
  document.getElementById("next").onclick=()=>flashMove(1);

  const card=document.getElementById("fc");
  let sx=0,sy=0,moved=false;

  card.addEventListener("pointerdown",e=>{
    sx=e.clientX;sy=e.clientY;moved=false;
    card.setPointerCapture?.(e.pointerId);
  });
  card.addEventListener("pointerup",e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)){
      moved=true;
      flashMove(dx<0?1:-1);
    }
  });
  card.addEventListener("click",()=>{
    if(moved){moved=false;return}
    flash.flipped=!flash.flipped;
    flashView();
  });
}
function flashMove(dir){
  const arr=words(flash.day);
  if(!arr.length)return;
  flash.index=(flash.index+dir+arr.length)%arr.length;
  flash.flipped=false;
  flashView(dir);
}
function changeFlashDay(dir){
  const ds=days();let i=ds.indexOf(flash.day);
  if(i<0)i=0;i=Math.max(0,Math.min(ds.length-1,i+dir));
  flash.day=ds[i];flash.index=0;flash.flipped=false;flashView();
}

function listView(){let ds=days(),d=ds[0]||1,q="";const render=()=>{let arr=words(d).filter(x=>(x.kanji+" "+x.reading+" "+x.meaning).toLowerCase().includes(q.toLowerCase()));shell(`<div class="page">${top("単語一覧")}<div class="sub">Database aktif · ${DB.length.toLocaleString()} kata</div><div class="day-grid" style="grid-template-columns:repeat(6,1fr);margin-bottom:12px">${ds.map(x=>`<button class="day ${x===d?"active":""}" data-d="${x}">${x}</button>`).join("")}</div><input class="list-search" id="search" placeholder="Cari kanji, reading, arti..." value="${esc(q)}"><div class="card">${arr.map(x=>`<div class="word"><div><b>${esc(x.kanji)}</b><small>${esc(x.reading)}</small></div><div class="meaning">${esc(x.meaning)}</div></div>`).join("")||'<div class="empty">Tidak ditemukan.</div>'}</div></div>`,"list");document.getElementById("back").onclick=home;APP.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{d=Number(b.dataset.d);render()});document.getElementById("search").oninput=e=>{q=e.target.value;let a=words(d).filter(x=>(x.kanji+" "+x.reading+" "+x.meaning).toLowerCase().includes(q.toLowerCase()));APP.querySelector(".card").innerHTML=a.map(x=>`<div class="word"><div><b>${esc(x.kanji)}</b><small>${esc(x.reading)}</small></div><div class="meaning">${esc(x.meaning)}</div></div>`).join("")||'<div class="empty">Tidak ditemukan.</div>'}};render()}
function progressView(){let ss=progress.sessions||[],correct=ss.reduce((n,s)=>n+s.score,0),total=ss.reduce((n,s)=>n+s.total,0);shell(`<div class="page">${top("進捗")}<div class="card"><div class="stat"><small>Database</small><b>${DB.length.toLocaleString()}</b><small>kata</small></div><div class="stat"><small>Quiz dikerjakan</small><b>${ss.length}</b></div><div class="stat"><small>Rata-rata jawaban</small><b>${total?Math.round(correct/total*100):0}%</b></div><br><button class="secondary danger" id="resetp">Reset progress</button></div><div class="section-title">Riwayat</div><div class="card">${ss.slice(0,15).map(s=>`<div class="word"><div><b>Day ${s.day}</b><small>${new Date(s.date).toLocaleDateString("id-ID")}</small></div><div class="meaning">${s.score}/${s.total}</div></div>`).join("")||'<div class="empty">Belum ada riwayat.</div>'}</div></div>`,"");document.getElementById("back").onclick=home;document.getElementById("resetp").onclick=()=>{if(confirm("Hapus progress quiz?")){progress={seen:{},repeat:{},sessions:[]};saveAll();progressView()}}}
function nextDayForNew(){return(days().at(-1)||0)+1}
function importRows(rows){let clean=[],existing=new Set(DB.map(x=>String(x.kanji)+"|"+String(x.reading)));for(let r of rows){let x=normalize(r,Date.now()+Math.random());if(!x.kanji||!x.reading)continue;let key=x.kanji+"|"+x.reading;if(existing.has(key))continue;existing.add(key);clean.push({...x,day:0,no:0})}if(!clean.length)return 0;let day=nextDayForNew(),n=0;for(let x of clean){if(n===100){day++;n=0}x.day=day;x.no=words(day).length+1+n;DB.push(x);n++}saveAll();return clean.length}
function parseCSV(text){let lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];let sep=lines[0].includes("\t")?"\t":",",head=splitCSV(lines[0],sep).map(x=>x.trim().toLowerCase()),idx={kanji:head.findIndex(x=>["kanji","漢字"].includes(x)),reading:head.findIndex(x=>["reading","furigana","読み","読み方"].includes(x)),meaning:head.findIndex(x=>["meaning","arti","意味"].includes(x))};return lines.slice(1).map(line=>{let c=splitCSV(line,sep);return{kanji:c[idx.kanji>=0?idx.kanji:0]||"",reading:c[idx.reading>=0?idx.reading:1]||"",meaning:c[idx.meaning>=0?idx.meaning:2]||""}})}
function splitCSV(line,sep){let out=[],cur="",quote=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++}else quote=!quote}else if(ch===sep&&!quote){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out}
function backupProgress(){const payload={app:"KUIS-N2",type:"progress-backup",version:2,savedAt:new Date().toISOString(),progress};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="KUIS-N2-PROGRESS-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Progress berhasil dibackup 💾")}
function restoreProgressFile(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(String(reader.result));if(data?.app!=="KUIS-N2"||data?.type!=="progress-backup"||!data?.progress||typeof data.progress!=="object")throw Error("invalid");if(!confirm("Restore backup? Progress saat ini akan diganti. Database kosakata tidak akan diubah."))return;progress={seen:{},repeat:{},sessions:[],...(data.progress||{})};localStorage.setItem(PKEY,JSON.stringify(progress));toast("Progress berhasil direstore 📂");home()}catch(e){toast("File backup tidak valid")}};reader.readAsText(file)}
function dbView(){let last=days().at(-1)||0;shell(`<div class="page">${top("Database")}<div class="sub">Satu database untuk Quiz, Flashcard, 単語一覧 dan Progress.</div><div class="card"><b>Database aktif</b><div style="font-size:28px;font-weight:900;margin-top:5px">${DB.length.toLocaleString()}</div><span class="badge">${days().length} Day</span><div class="status">Kosakata baru otomatis mulai <b>Day ${last+1}</b>, maksimal 100 kata per Day.</div></div><div class="section-title">Tambah / Update Database</div><div class="card"><input class="field" id="file" type="file" accept=".json,.csv,.txt"><p class="small">Format JSON: array objek kanji, reading, meaning. CSV: kolom Kanji, Reading/Furigana, Meaning.</p><div class="db-actions"><button class="secondary" id="export">📤 Export JSON</button><button class="secondary" id="resetdb">↺ Kembalikan Database Awal</button></div></div><div class="section-title">💾 Backup / Restore Progress</div><div class="card"><div class="status">Simpan progress sebagai file di perangkatmu. Upload sendiri ke Google Drive bila ingin.</div><br><div class="db-actions"><button class="secondary" id="backupProgress">💾 Backup Progress</button><button class="secondary" id="restoreProgress">📂 Restore Progress</button></div><input id="progressFile" type="file" accept=".json" hidden><p class="small">Backup hanya berisi progress belajar dan riwayat quiz.</p></div></div>`,"db");document.getElementById("back").onclick=home;document.getElementById("file").onchange=e=>{let f=e.target.files[0];if(f)readImport(f)};document.getElementById("export").onclick=exportDB;document.getElementById("resetdb").onclick=()=>{if(confirm("Kembalikan database bawaan? Data tambahan lokal akan hilang.")){DB=BUILTIN.map(x=>({...x}));saveAll();dbView()}};document.getElementById("backupProgress").onclick=backupProgress;document.getElementById("restoreProgress").onclick=()=>document.getElementById("progressFile").click();document.getElementById("progressFile").onchange=e=>{let f=e.target.files[0];if(f)restoreProgressFile(f)}}
function readImport(file){let reader=new FileReader();reader.onload=()=>{try{let text=String(reader.result),rows;if(file.name.toLowerCase().endsWith(".json")){let j=JSON.parse(text);rows=Array.isArray(j)?j:(Array.isArray(j.vocabulary)?j.vocabulary:[])}else rows=parseCSV(text);let n=importRows(rows);toast(n?`${n} kata ditambahkan`:"Tidak ada kata baru");dbView()}catch(e){toast("Format file tidak valid")}};reader.readAsText(file)}
function exportDB(){let blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),vocabulary:DB},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="KUIS-N2-DATABASE.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function show(v){clearInterval(timer);if(v==="home")home();else if(v==="quiz")quizMenu();else if(v==="flash")flashView();else if(v==="list")listView();else if(v==="db")dbView();else progressView()}
home();
})();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script>
