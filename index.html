<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>KUIS N2</title>
<style>
:root{--bg:#fff8f4;--card:#fff;--ink:#26313d;--muted:#7b8792;--pink:#ef8fa8;--pink2:#f7c9d4;--blue:#8bb9d8;--green:#79b897;--cream:#fff1dc;--red:#d9899b;--line:#eee4df;--shadow:0 12px 30px rgba(76,54,55,.08);--radius:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fff8f4,#f8fbfd);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-tap-highlight-color:transparent}body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a8cde3;outline-offset:2px}.app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:90px}.page{padding:18px 16px 24px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#fce5ea,#e7f3fa);border-radius:28px;padding:22px 20px 20px;box-shadow:var(--shadow);margin-bottom:16px}.hero:after{content:'🌸';position:absolute;right:18px;top:10px;font-size:54px;opacity:.55}.hero h1{margin:0;font-size:27px;letter-spacing:.04em}.hero p{margin:7px 0 0;color:#687583;font-size:13px}.fuji{margin:18px -20px -20px;height:60px;background:linear-gradient(180deg,transparent 0 10%,#a8c7d9 11% 55%,#8eb1c6 56%);clip-path:polygon(0 100%,28% 45%,43% 67%,61% 15%,76% 61%,100% 28%,100% 100%)}.greeting{font-size:14px;color:var(--muted);margin:6px 3px 12px}.progress-card,.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.progress-row{display:flex;justify-content:space-between;align-items:end}.progress-row strong{font-size:25px}.progress-row span{font-size:12px;color:var(--muted)}.bar{height:9px;background:#f0e8e5;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--blue));border-radius:inherit;transition:width .3s}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.action{border:1px solid var(--line);background:#fff;border-radius:20px;padding:17px;text-align:left;min-height:108px;box-shadow:var(--shadow)}.action:active{transform:scale(.98)}.ico{font-size:26px}.action b{display:block;margin-top:9px;font-size:15px}.action small{display:block;color:var(--muted);margin-top:3px}.quote{margin-top:14px;padding:16px 18px;border-radius:18px;background:var(--cream);font-weight:700;color:#6e5c48;text-align:center}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back,.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#fff}.top h2{margin:0;font-size:20px}.sub{font-size:12px;color:var(--muted);margin:-7px 0 14px 2px}.section-title{font-size:13px;font-weight:800;margin:18px 2px 9px;color:#5e6973}.day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.day{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 3px;text-align:center;min-height:48px}.day b{display:block}.day small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.day.active,.choice.active{border-color:var(--pink);background:#fff0f4;box-shadow:0 0 0 1px rgba(239,143,168,.18)}.day:disabled{opacity:.42;cursor:not-allowed;background:#f7f4f2}.mode-grid{display:grid;gap:9px}.choice{border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px;text-align:left}.choice b{display:block}.choice small{display:block;color:var(--muted);margin-top:3px}.startbtn,.primary{width:100%;border:0;border-radius:16px;padding:14px;background:var(--ink);color:#fff;font-weight:800}.secondary{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff;font-weight:700}.secondary:active,.primary:active,.startbtn:active{transform:scale(.99)}.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 10px;font-size:12px}.timer{font-variant-numeric:tabular-nums}.quiz-card{background:#fff;border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow);padding:24px 18px}.qmeta{text-align:center;color:var(--muted);font-size:12px}.prompt{text-align:center;font-size:42px;font-weight:800;margin:22px 5px;line-height:1.3;word-break:break-word}.prompt.meaning{font-size:24px}.answers{display:grid;gap:10px}.answer{border:1px solid #e7e1de;background:#fff;border-radius:16px;padding:14px;text-align:left;min-height:52px}.answer.correct{border-color:var(--green);background:#eff9f3}.answer.wrong{border-color:var(--red);background:#fff0f3}.answer:disabled{opacity:1}.quiz-tools{display:flex;gap:9px;margin-top:12px}.quiz-tools button{flex:1}.result{margin-top:30px;text-align:center}.score{font-size:54px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{font-size:20px;display:block}.stat small{color:var(--muted)}.list-search{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px;margin-bottom:10px}.word{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}.word:last-child{border-bottom:0}.word b{font-size:20px}.word small{display:block;color:var(--muted);margin-top:2px}.word .meaning{text-align:right;font-size:13px;max-width:45%}.flash-wrap{perspective:1000px}.flash-card{height:430px;position:relative;transform-style:preserve-3d;transition:transform .45s ease;cursor:pointer;touch-action:pan-y;user-select:none}.flash-card.is-flipped{transform:rotateY(180deg)}.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;overflow:hidden}.flash-face.flash-back{transform:rotateY(180deg)}.flash-kanji{font-size:78px;font-weight:900}.flash-reading{font-size:24px;margin-top:12px;color:#697580}.flash-meaning{font-size:25px;font-weight:800}.swipe-hint{text-align:center;color:var(--muted);font-size:12px;margin:11px 0}.flash-controls{display:flex;gap:10px}.flash-controls button{flex:1}.flash-card.anim-left{animation:cardOutLeft .22s ease forwards}.flash-card.anim-right{animation:cardOutRight .22s ease forwards}.flash-card.enter-next{animation:cardInRight .25s ease}.flash-card.enter-prev{animation:cardInLeft .25s ease}@keyframes cardOutLeft{to{transform:translateX(-115%) rotate(-8deg);opacity:0}}@keyframes cardOutRight{to{transform:translateX(115%) rotate(8deg);opacity:0}}@keyframes cardInRight{from{transform:translateX(35%) rotate(4deg);opacity:0}to{transform:translateX(0) rotate(0);opacity:1}}@keyframes cardInLeft{from{transform:translateX(-35%) rotate(-4deg);opacity:0}to{transform:translateX(0) rotate(0);opacity:1}}.manage-grid{display:grid;gap:10px}.stat-card{padding:16px;background:#fff;border:1px solid var(--line);border-radius:18px}.stat-card strong{font-size:28px}.danger{color:#b75b5b}.bottom{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:transparent;color:#87919a;padding:7px 2px;font-size:11px}.nav span{display:block;font-size:20px;line-height:20px}.nav.active{color:#d46f89;font-weight:800}.empty{padding:30px 10px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#26313d;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;z-index:30;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:380px){.day-grid{grid-template-columns:repeat(4,1fr)}.flash-card{height:390px}.prompt{font-size:36px}}
</style>
</head>
<body>
<main id="app" class="app"></main><div id="toast" class="toast"></div>
<script src="data.js"></script>
<script>
(()=>{
'use strict';
const DATA=Array.isArray(window.KANJI_DATA)?window.KANJI_DATA:[];
const STORE='kuisN2_final_v2';
const app=document.getElementById('app');
const toastEl=document.getElementById('toast');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
const byDay=d=>DATA.filter(x=>Number(x.day)===Number(d));
let state={seen:{},repeat:{},sessions:[]};
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved)state={...state,...saved}}catch(e){}
let timerId=null,session=null;
let flash={day:1,index:0,flipped:false,enterClass:''};
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),1600)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function seenCount(){return Object.values(state.seen||{}).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0)}
function nav(active){return `<nav class="bottom"><button class="nav ${active==='home'?'active':''}" data-nav="home"><span>⌂</span>Home</button><button class="nav ${active==='quiz'?'active':''}" data-nav="quiz"><span>✎</span>Quiz</button><button class="nav ${active==='flash'?'active':''}" data-nav="flash"><span>◈</span>Flash</button><button class="nav ${active==='list'?'active':''}" data-nav="list"><span>▤</span>単語</button></nav>`}
function shell(html,active){app.innerHTML=html+nav(active);app.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.nav)))}
function top(title){return `<div class="top"><button class="back" id="back" aria-label="Kembali">‹</button><h2>${title}</h2></div>`}
function home(){stopTimer();const p=seenCount(),pct=DATA.length?Math.min(100,p/DATA.length*100):0;const current=Math.min(34,Math.floor(p/100)+1);shell(`<div class="page"><section class="hero"><h1>KUIS N2</h1><p>JLPT N2 Vocabulary · 35 Days</p><div class="fuji"></div></section><div class="greeting">こんにちは 👋 Hari ini lanjut Day ${current} yuk.</div><section class="progress-card"><div class="progress-row"><div><span>学習進捗</span><strong>${p} / ${DATA.length}</strong></div><span>${pct.toFixed(1)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></section><div class="actions"><button class="action" id="goQuiz"><div class="ico">📝</div><b>今日のクイズ</b><small>Latihan kosakata</small></button><button class="action" id="goFlash"><div class="ico">🃏</div><b>フラッシュカード</b><small>Tap & swipe</small></button><button class="action" id="goList"><div class="ico">📚</div><b>単語一覧</b><small>Lihat semua kata</small></button><button class="action" id="goProgress"><div class="ico">📈</div><b>進捗</b><small>Lihat hasil belajar</small></button></div><div class="quote">「継続は力なり」</div></div>`,'home');document.getElementById('goQuiz').onclick=quizMenu;document.getElementById('goFlash').onclick=flashView;document.getElementById('goList').onclick=listView;document.getElementById('goProgress').onclick=progressView}
function quizMenu(){stopTimer();let selectedDay=1,selectedMode='kr',selectedTime=20,selectedCount=10;shell(`<div class="page">${top('Quiz')}<div class="sub">Pilih hari dan mode. Tombol yang dipilih akan berubah warna.</div><div class="section-title">Hari</div><div class="day-grid" id="dayChoices">${Array.from({length:35},(_,i)=>{const n=i+1,c=byDay(n).length;return `<button class="day ${n===1?'active':''}" data-day="${n}" ${c===0?'disabled':''}><b>${n}</b><small>${c?c+' kata':'kosong'}</small></button>`}).join('')}</div><div class="section-title">Mode</div><div class="mode-grid" id="modeChoices"><button class="choice active" data-mode="kr"><b>Kanji → Reading</b><small>Pilih cara baca</small></button><button class="choice" data-mode="rk"><b>Reading → Kanji</b><small>Pilih kanji</small></button><button class="choice" data-mode="km"><b>Kanji → Arti</b><small>Pilih arti Indonesia</small></button><button class="choice" data-mode="mix"><b>Mix</b><small>Campuran</small></button></div><div class="section-title">Timer</div><div class="mode-grid" id="timeChoices"><button class="choice active" data-time="20">20 detik / soal</button><button class="choice" data-time="30">30 detik / soal</button><button class="choice" data-time="60">60 detik / soal</button></div><div class="section-title">Jumlah soal</div><div class="mode-grid" id="countChoices"><button class="choice active" data-count="10">10 soal</button><button class="choice" data-count="20">20 soal</button><button class="choice" data-count="50">50 soal</button></div><br><button class="startbtn" id="startQuiz">Mulai Quiz →</button></div>`,'quiz');
const activate=(selector,attr,cb)=>app.querySelectorAll(selector).forEach(btn=>btn.addEventListener('click',()=>{const value=btn.dataset[attr];app.querySelectorAll(selector).forEach(x=>x.classList.remove('active'));btn.classList.add('active');cb(value)}));
activate('#dayChoices [data-day]','day',v=>selectedDay=Number(v));activate('#modeChoices [data-mode]','mode',v=>selectedMode=v);activate('#timeChoices [data-time]','time',v=>selectedTime=Number(v));activate('#countChoices [data-count]','count',v=>selectedCount=Number(v));document.getElementById('startQuiz').onclick=()=>startQuiz(selectedDay,selectedMode,selectedTime,selectedCount);document.getElementById('back').onclick=home}
function makeQuestions(day,count){const data=byDay(day);const seen=new Set((state.seen[day]||[]).map(String));const repeats=new Set((state.repeat[day]||[]).map(String));let fresh=shuffle(data.filter(x=>!seen.has(String(x.id)))).slice(0,count);if(fresh.length===0)fresh=shuffle(data.filter(x=>repeats.has(String(x.id)))).slice(0,count).map(x=>({...x,_repeat:true}));return fresh}
function startQuiz(day,mode,time,count){const items=makeQuestions(day,count);if(!items.length){toast('Tidak ada soal tersisa di Day ini.');return}session={day,mode,time,items,index:0,score:0,answers:[],left:time,locked:false};renderQuestion()}
function renderQuestion(){stopTimer();if(!session||session.index>=session.items.length){finishQuiz();return}session.left=session.time;const q=session.items[session.index];let mode=session.mode;if(mode==='mix')mode=shuffle(['kr','rk','km'])[0];session.currentMode=mode;const correct=mode==='kr'?q.reading:mode==='rk'?q.kanji:q.meaning;const pool=[...new Set(byDay(session.day).map(x=>mode==='kr'?x.reading:mode==='rk'?x.kanji:x.meaning).filter(x=>x!==correct))];const options=shuffle([correct,...shuffle(pool).slice(0,3)]);app.innerHTML=`<div class="page"><div class="quiz-head"><span class="pill">Day ${session.day} · ${session.index+1}/${session.items.length}</span><span class="pill timer">⏱ <b id="clock">${session.left}</b>s</span></div><div class="bar"><i style="width:${session.index/session.items.length*100}%"></i></div><br><section class="quiz-card"><div class="qmeta">${mode==='kr'?'読み方は？':mode==='rk'?'漢字は？':'意味は？'}</div><div class="prompt ${mode==='km'?'meaning':''}">${esc(mode==='rk'?q.reading:q.kanji)}</div><div class="answers" id="answers">${options.map((o,i)=>`<button class="answer" data-answer-index="${i}">${esc(o)}</button>`).join('')}</div><div class="quiz-tools"><button class="secondary" id="exitQuiz">終了</button></div></section></div>`;const answerButtons=[...document.querySelectorAll('.answer')];answerButtons.forEach((b,i)=>b.addEventListener('click',()=>answer(i,options,correct)));document.getElementById('exitQuiz').onclick=()=>{stopTimer();if(confirm('Keluar dari quiz? Soal yang belum dijawab tidak dihitung.'))quizMenu()};timerId=setInterval(()=>{if(!session||session.locked)return;session.left--;const clock=document.getElementById('clock');if(clock)clock.textContent=session.left;if(session.left<=0)answer(-1,options,correct)},1000)}
function answer(index,options,correct){if(!session||session.locked)return;session.locked=true;stopTimer();const q=session.items[session.index];const value=index>=0?options[index]:null;const ok=value!==null&&value===correct;const seen=new Set((state.seen[session.day]||[]).map(String));seen.add(String(q.id));state.seen[session.day]=[...seen];const rep=new Set((state.repeat[session.day]||[]).map(String));if(ok)rep.delete(String(q.id));else rep.add(String(q.id));state.repeat[session.day]=[...rep];session.score+=ok?1:0;session.answers.push({id:q.id,correct:ok});const buttons=[...document.querySelectorAll('.answer')];buttons.forEach((b,i)=>{b.disabled=true;if(options[i]===correct)b.classList.add('correct');if(i===index&&!ok)b.classList.add('wrong')});save();setTimeout(()=>{if(!session)return;session.index++;session.locked=false;renderQuestion()},260)}
function finishQuiz(){stopTimer();if(!session)return;const s=session,wrong=s.answers.filter(a=>!a.correct).length;state.sessions=Array.isArray(state.sessions)?state.sessions:[];state.sessions.unshift({day:s.day,score:s.score,total:s.items.length,wrong,date:Date.now()});state.sessions=state.sessions.slice(0,100);const repeatCount=(state.repeat[s.day]||[]).length;const freshLeft=byDay(s.day).filter(x=>!(state.seen[s.day]||[]).map(String).includes(String(x.id))).length;session=null;save();app.innerHTML=`<div class="page"><div class="result"><div class="pill">Day ${s.day} selesai</div><h2>お疲れさま！</h2><div class="score">${s.score}/${s.items.length}</div><div class="stats"><div class="stat"><b>${s.score}</b><small>正解</small></div><div class="stat"><b>${wrong}</b><small>不正解</small></div><div class="stat"><b>${repeatCount}</b><small>復習</small></div></div><p style="color:var(--muted);font-size:13px">${freshLeft?freshLeft+' kata baru masih tersedia.':repeatCount?'Ada kata yang perlu diulang.':'Day ini selesai.'}</p><button class="primary" id="continueQuiz">${freshLeft||repeatCount?'Lanjut latihan':'Kembali ke Quiz'}</button><br><br><button class="secondary" id="resultHome">Home</button></div></div>`;document.getElementById('continueQuiz').onclick=()=>freshLeft||repeatCount?startQuiz(s.day,s.mode,s.time,s.items.length):quizMenu();document.getElementById('resultHome').onclick=home}
function flashView(enterClass=''){stopTimer();const data=byDay(flash.day);if(!data.length){flash.day=1;flash.index=0;return flashView(enterClass)}if(flash.index>=data.length)flash.index=0;const q=data[flash.index];shell(`<div class="page">${top('Flashcard')}<div class="sub">Day ${flash.day} · ${flash.index+1}/${data.length}</div><div class="day-grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px"><button class="day" id="prevDay">← Day</button><button class="day" id="nextDay">Day →</button></div><div class="flash-wrap"><div class="flash-card ${flash.flipped?'is-flipped ':''}${enterClass}" id="flashCard"><div class="flash-face"><div class="qmeta">KANJI</div><div class="flash-kanji">${esc(q.kanji)}</div><div class="flash-reading">${esc(q.reading)}</div><div class="swipe-hint">Tap kartu untuk flip</div></div><div class="flash-face flash-back"><div class="qmeta">ARTI</div><div class="flash-meaning">${esc(q.meaning)}</div><div class="flash-reading">${esc(q.reading)}</div><div class="swipe-hint">Tap lagi untuk kembali</div></div></div></div><div class="swipe-hint">← Geser kiri: berikutnya · kanan: sebelumnya →</div><div class="flash-controls"><button class="secondary" id="prevFlash">← Sebelumnya</button><button class="primary" id="nextFlash">Berikutnya →</button></div></div>`,'flash');document.getElementById('back').onclick=home;document.getElementById('flashCard').addEventListener('click',()=>{flash.flipped=!flash.flipped;flashView()});document.getElementById('prevFlash').onclick=()=>flashMove(-1);document.getElementById('nextFlash').onclick=()=>flashMove(1);document.getElementById('prevDay').onclick=()=>{flash.day=Math.max(1,flash.day-1);flash.index=0;flash.flipped=false;flashView('enter-prev')};document.getElementById('nextDay').onclick=()=>{flash.day=Math.min(34,flash.day+1);flash.index=0;flash.flipped=false;flashView('enter-next')};let sx=0,sy=0,moved=false;const card=document.getElementById('flashCard');card.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY;moved=false},{passive:true});card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){moved=true;flashMove(dx<0?1:-1)}},{passive:true})}
function flashMove(dir){const card=document.getElementById('flashCard');if(!card)return;card.classList.remove('anim-left','anim-right');void card.offsetWidth;card.classList.add(dir>0?'anim-left':'anim-right');setTimeout(()=>{const n=byDay(flash.day).length;flash.index=(flash.index+dir+n)%n;flash.flipped=false;flashView(dir>0?'enter-next':'enter-prev')},210)}
function listView(){let d=1,query='';const render=()=>{const data=byDay(d).filter(q=>(q.kanji+' '+q.reading+' '+q.meaning).toLowerCase().includes(query.toLowerCase()));shell(`<div class="page">${top('単語一覧')}<div class="sub">Cari kosakata per hari.</div><div class="day-grid" style="grid-template-columns:repeat(6,1fr);margin-bottom:12px">${Array.from({length:34},(_,i)=>`<button class="day ${d===i+1?'active':''}" data-list-day="${i+1}">${i+1}</button>`).join('')}</div><input class="list-search" id="search" placeholder="Cari kanji, reading, arti..." value="${esc(query)}"><div class="card" id="wordList" style="padding:4px 14px">${wordsHtml(data)}</div></div>`,'list');document.getElementById('back').onclick=home;app.querySelectorAll('[data-list-day]').forEach(b=>b.onclick=()=>{d=Number(b.dataset.listDay);render()});document.getElementById('search').oninput=e=>{query=e.target.value;const arr=byDay(d).filter(q=>(q.kanji+' '+q.reading+' '+q.meaning).toLowerCase().includes(query.toLowerCase()));document.getElementById('wordList').innerHTML=wordsHtml(arr)}};render()}
function wordsHtml(data){return data.map(q=>`<div class="word"><div><b>${esc(q.kanji)}</b><small>${esc(q.reading)}</small></div><div class="meaning">${esc(q.meaning)}</div></div>`).join('')||'<div class="empty">Tidak ditemukan.</div>'}
function progressView(){stopTimer();const sessions=Array.isArray(state.sessions)?state.sessions:[],correct=sessions.reduce((n,s)=>n+s.score,0),total=sessions.reduce((n,s)=>n+s.total,0);shell(`<div class="page">${top('進捗')}<div class="manage-grid"><div class="stat-card"><small>Vocabulary selesai</small><br><strong>${seenCount()}</strong> / ${DATA.length}</div><div class="stat-card"><small>Quiz dikerjakan</small><br><strong>${sessions.length}</strong></div><div class="stat-card"><small>Akurasi</small><br><strong>${total?Math.round(correct/total*100):0}%</strong></div><button class="secondary danger" id="reset">Reset semua progress</button></div><div class="section-title">Riwayat terbaru</div><div class="card">${sessions.slice(0,12).map(s=>`<div class="word"><div><b>Day ${s.day}</b><small>${new Date(s.date).toLocaleDateString('id-ID')}</small></div><div class="meaning">${s.score}/${s.total}</div></div>`).join('')||'<div class="empty">Belum ada riwayat quiz.</div>'}</div></div>`,'');document.getElementById('back').onclick=home;document.getElementById('reset').onclick=()=>{if(confirm('Hapus semua progress di perangkat ini?')){state={seen:{},repeat:{},sessions:[]};save();progressView()}}}
function show(v){if(v==='home')home();else if(v==='quiz')quizMenu();else if(v==='flash')flashView();else if(v==='list')listView();else progressView()}
home();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=2'))}</script>
</body>
