<style>
:root{--navy:#173b72;--blue:#4f78c9;--blue2:#dce8ff;--ink:#17305f;--muted:#66758f;--bg:#f8f8f5;--white:#fff;--line:#e3e8f1;--shadow:0 12px 35px rgba(23,59,114,.10);--radius:24px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#fbfbf8 0%,#f6f8fb 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,select,input{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.top{padding:18px 18px 8px;background:rgba(251,251,248,.94);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}.head{max-width:920px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brandbox{display:flex;align-items:center;gap:12px}.fuji{font-size:38px;line-height:1}.brand{font-size:27px;letter-spacing:.4px;font-weight:850;color:var(--navy)}.brandjp{font-size:13px;color:#6c7890;margin-top:1px}.gear{width:44px;height:44px;border:0;background:#fff;border-radius:50%;font-size:24px;color:var(--navy);box-shadow:0 5px 18px rgba(23,59,114,.08)}main{max-width:920px;margin:auto;padding:10px 16px 105px}.nav{display:none}.hero{position:relative;min-height:195px;padding:22px 12px 8px;overflow:hidden}.hero h1{font-size:31px;line-height:1.25;margin:12px 0 10px;font-weight:850;color:var(--navy)}.hero p{font-size:16px;line-height:1.6;color:#66758f;margin:0;max-width:320px}.hero-art{position:absolute;right:-8px;top:5px;font-size:108px;opacity:.9;filter:saturate(.9)}.hero-art:after{content:'🌸';font-size:46px;position:absolute;right:-4px;top:75px}.progress-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#547cc8,#365da9);color:#fff;border-radius:26px;padding:23px 20px;box-shadow:0 15px 35px rgba(55,91,164,.22);display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center}.progress-card:after{content:'青海波';position:absolute;right:-10px;bottom:-22px;font-size:74px;opacity:.07;font-weight:900}.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff 0 120deg,rgba(255,255,255,.22) 120deg 360deg);position:relative;margin:auto}.ring:before{content:'';position:absolute;inset:10px;border-radius:50%;background:#5277c2}.ring-inner{position:relative;text-align:center;color:#fff}.ring-inner small{display:block;font-size:15px;font-weight:700;opacity:.9}.ring-inner strong{display:block;font-size:29px;line-height:1.1}.progress-title{font-weight:750;font-size:15px;opacity:.95}.progress-big{font-size:30px;font-weight:850;margin:7px 0}.whitebar{height:9px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}.whitebar i{display:block;height:100%;width:33%;background:#eaf1ff;border-radius:99px}.progress-meta{display:flex;gap:24px;margin-top:17px}.meta strong{display:block;font-size:20px}.meta span{font-size:12px;opacity:.85}.streak{background:#ffb33e;color:#fff;padding:6px 12px;border-radius:13px;font-weight:800;display:inline-block}.section-title{font-size:19px;margin:27px 4px 12px;font-weight:850}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.action{min-height:190px;border-radius:24px;padding:20px;position:relative;border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;text-align:left}.action:active{transform:scale(.985)}.action .icon{font-size:42px;margin-bottom:12px}.action h3{font-size:21px;margin:0 0 5px;color:var(--navy)}.action p{margin:0;color:#66758f;font-size:14px;line-height:1.5;max-width:190px}.action .arrow{position:absolute;right:16px;bottom:16px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.65)}.a-blue{background:#eef4ff}.a-purple{background:#f8efff}.a-green{background:#eef8f3}.a-orange{background:#fff4e9}.quote{margin-top:16px;padding:17px 20px;border-radius:22px;background:#edf4ff;border:1px solid #dce8ff;display:flex;align-items:center;gap:15px}.quote-icon{font-size:35px}.quote b{font-size:17px}.quote small{display:block;color:#71809a;margin-top:3px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid #e7ebf2;padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 -8px 25px rgba(23,59,114,.06)}.bottom-nav button{border:0;background:none;color:#75829a;font-weight:700;font-size:11px;padding:4px 0}.bottom-nav button span{display:block;font-size:25px;line-height:28px;margin-bottom:2px}.bottom-nav button.active{color:#315bb5}.dot{width:5px;height:5px;border-radius:50%;background:#315bb5;margin:3px auto 0}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.label{display:block;font-weight:750;font-size:13px;margin-bottom:6px}.field{width:100%;padding:12px;border:1px solid #d7deea;border-radius:14px;background:#fff;color:var(--ink)}.muted{color:var(--muted)}.big{font-size:64px;font-weight:850;text-align:center;margin:25px 0 5px}.sub{text-align:center;font-size:20px;margin:5px}.answers{display:grid;gap:10px;margin-top:18px}.ans{padding:16px;border:1px solid #d8dfeb;background:#fff;border-radius:15px;text-align:left;font-size:16px;cursor:pointer;touch-action:manipulation;color:var(--ink);box-shadow:0 4px 12px rgba(23,59,114,.05)}.ans.correct{border-color:#37a76f;background:#e9f8ef}.ans.wrong{border-color:#db6262;background:#fff0f0}.ans:disabled{cursor:default;opacity:1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid #d5ddea;background:#fff;border-radius:14px;padding:11px 14px;cursor:pointer;color:var(--ink);font-weight:700}.btn:active{transform:scale(.98)}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:#b83d3d}.bar{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:10px 0}.bar div{height:100%;background:var(--blue)}.pill{background:#edf2fa;border-radius:99px;padding:5px 9px;font-size:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}.notice{padding:10px;border-radius:12px;background:#edf4ff;color:#24519d;margin:8px 0}.stats{font-size:13px}.feedback{text-align:center;font-weight:800;margin:12px 0}.saved{background:#fff4d8;border-color:#efb649}.resume{border-left:4px solid var(--blue)}.small{font-size:13px}.flash-wrap{perspective:1000px;margin:14px 0}.flash{min-height:280px;position:relative;transform-style:preserve-3d;transition:transform .5s ease;cursor:pointer;touch-action:manipulation}.flash.flipped{transform:rotateY(180deg)}.flash-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #d7dfec;border-radius:24px;background:linear-gradient(145deg,#fff,#f5f8fd);backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:20px;box-shadow:var(--shadow)}.flash-back{transform:rotateY(180deg);background:linear-gradient(145deg,#f5f0ff,#fff)}.flash-face .big{margin:0}.flash-nav{display:flex;justify-content:space-between;align-items:center;gap:8px}.star{font-size:24px;line-height:1;border:0;background:transparent;cursor:pointer}.empty{text-align:center;padding:25px}.hidden{display:none!important}@media(max-width:600px){main{padding-left:14px;padding-right:14px}.progress-card{grid-template-columns:112px 1fr;gap:12px;padding:17px}.ring{width:104px;height:104px}.ring:before{inset:8px}.ring-inner strong{font-size:23px}.progress-big{font-size:24px}.progress-meta{gap:12px}.hero h1{font-size:29px}.action{min-height:175px;padding:17px}.action .icon{font-size:36px}.action h3{font-size:19px}.big{font-size:52px}}
</style>
</head>
<body>
<header class="top"><div class="head"><div class="brandbox"><div class="fuji">🗻</div><div><div class="brand">KUIS N2</div><div class="brandjp">日本語・漢字・語彙</div></div></div><button class="gear" id="gearBtn" aria-label="Pengaturan">⚙️</button></div></header>
<main>
<div id="nav" class="nav">
<button class="btn" data-view="home">Quiz</button><button class="btn" data-view="flash">Flashcards</button><button class="btn" data-view="list">Search/List</button><button class="btn" data-view="manage">Database</button>
</div>
<div id="app"></div>
</main>
<nav class="bottom-nav" id="bottomNav"><button data-view="home" class="active"><span>⌂</span>Home<div class="dot"></div></button><button data-view="quiz"><span>✎</span>Quiz</button><button data-view="list"><span>▣</span>単語</button><button data-view="manage"><span>▥</span>進捗</button></nav>
<script src="data.js"></script>
<script>
(function(){
'use strict';
const DATA=window.KANJI_DATA||[];
const STORE='kanjiQuizN2_v2';
const $=id=>document.getElementById(id);
let state={completed:{},sessions:{},custom:[],savedCards:{},active:null,quizProgress:{}};
try{state=Object.assign(state,JSON.parse(localStorage.getItem(STORE)||'{}'));}catch(e){}
state.completed=state.completed||{};state.sessions=state.sessions||{};state.custom=state.custom||[];state.savedCards=state.savedCards||{};state.quizProgress=state.quizProgress||{};
let currentSession=null,flashIndex=0,flashDay=1,flashFlipped=false,listDay=1,quizTimer=null;
const all=()=>DATA.concat(state.custom);
const dayData=d=>all().filter(x=>Number(x.day)===Number(d));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const options=(correct,vals)=>shuffle([correct,...shuffle([...new Set(vals.filter(v=>v&&v!==correct))]).slice(0,3)]);
function setCount(){const el=$('count');if(el)el.textContent=all().length+' vocab';}
function show(view){if(quizTimer)clearInterval(quizTimer);if(view==='home')home();else if(view==='quiz')quizMenu();else if(view==='flash')flash();else if(view==='list')list();else manage();}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){currentSession=null;show(b.dataset.view);}});
$('bottomNav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){document.querySelectorAll('#bottomNav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentSession=null;show(b.dataset.view);}});
$('gearBtn').addEventListener('click',()=>show('manage'));
function home(){
 setCount();
 const done=Object.values(state.completed||{});const answered=done.reduce((n,x)=>n+Number(x.total||0),0);const pct=Math.min(100,Math.round((answered/3320)*100));
 const active=state.active;
 $('app').innerHTML=`<section class="hero"><div class="hero-art">🌸🗻</div><h1>今日も頑張りましょう 🌸</h1><p>コツコツの積み重ねが、<br>大きな力になります。</p></section>
 <section class="progress-card"><div class="ring" style="background:conic-gradient(#fff ${Math.max(18,pct*3.6)}deg,rgba(255,255,255,.22) ${Math.max(18,pct*3.6)}deg 360deg)"><div class="ring-inner"><small>Day</small><strong>${active?active.day:Math.min(35,Math.floor(answered/100)+1)} / 35</strong></div></div><div><div class="progress-title">▥ 学習の進捗</div><div class="progress-big">${answered.toLocaleString()} <small style="font-size:14px;font-weight:700">/ 3,320 語</small></div><div class="whitebar"><i style="width:${Math.max(2,pct)}%"></i></div><div style="font-size:12px;text-align:right;margin-top:4px;opacity:.85">${pct}%</div><div class="progress-meta"><div class="meta"><span>🎯 本日の目標</span><strong>100 語</strong></div><div class="meta"><span>🔥 連続記録</span><strong><span class="streak">${Math.min(30,done.length||0)} 日</span></strong></div></div></div></section>
 ${active?`<div class="card resume"><div class="row between"><div><b>Quiz tersimpan</b><div class="muted small">Day ${active.day} · Soal ${active.i+1}/${active.items.length}</div></div><button class="btn primary" id="resumeBtn">Lanjutkan →</button></div></div>`:''}
 <div class="section-title">Mulai belajar</div><div class="action-grid"><button class="action a-blue" data-action="quiz"><div class="icon">📝</div><h3>今日のクイズ</h3><p>Latihan soal untuk menguji ingatanmu.</p><span class="arrow">→</span></button><button class="action a-purple" data-action="flash"><div class="icon">🃏</div><h3>フラッシュカード</h3><p>Hafalkan kosakata dengan cepat.</p><span class="arrow">→</span></button><button class="action a-green" data-action="list"><div class="icon">📖</div><h3>単語一覧</h3><p>Lihat semua kosakata dan cari Kanji.</p><span class="arrow">→</span></button><button class="action a-orange" data-action="manage"><div class="icon">📊</div><h3>進捗</h3><p>Periksa progres dan kartu tersimpan.</p><span class="arrow">→</span></button></div>
 <div class="quote"><div class="quote-icon">⛩️</div><div><b>継続は力なり</b><small>— Terus melangkah, kemampuan akan bertambah —</small></div></div>`;
 document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{currentSession=null;show(b.dataset.action==='quiz'?'quiz':b.dataset.action);}));
 if(active)$('resumeBtn').addEventListener('click',()=>{currentSession=state.active;quiz();});
}
function quizMenu(){
 const active=state.active;
 $('app').innerHTML=`<div class="card"><h2>📝 Quiz N2</h2>
 ${active?`<div class="notice">Ada quiz tersimpan: Day ${active.day}, soal ${active.i+1}/${active.items.length}<br><button class="btn primary" id="resumeQuiz" style="margin-top:8px">Lanjutkan Quiz →</button></div>`:''}
 <div class="grid">
 <div><label class="label">Day</label><select id="day" class="field">${[...Array(35)].map((_,i)=>`<option value="${i+1}">Day ${i+1}</option>`).join('')}</select></div>
 <div><label class="label">Jumlah Soal</label><select id="num" class="field"><option>10</option><option>20</option><option>50</option><option>100</option></select></div>
 <div><label class="label">Mode</label><select id="mode" class="field"><option value="kr">Kanji → Reading</option><option value="rk">Reading → Kanji</option><option value="km">Kanji → Arti</option><option value="mix">Mix</option></select></div>
 <div><label class="label">Waktu / Soal</label><select id="timer" class="field"><option value="15">15 detik</option><option value="20">20 detik</option><option value="30">30 detik</option><option value="60">60 detik</option></select></div>
 </div>
 <button class="btn primary" id="startQuiz" style="margin-top:16px;width:100%">Mulai Quiz →</button>
 </div>`;
 $('startQuiz').addEventListener('click',start);
 if(active)$('resumeQuiz').addEventListener('click',()=>{currentSession=state.active;quiz();});
function start(day,mode,timer,batchSize){
  const pool=dayData(day);
  const qp=state.quizProgress[day]||{seen:[],repeat:[]};
  const seen=new Set(qp.seen||[]);
  const repeat=new Set(qp.repeat||[]);

  let fresh=shuffle(pool.filter(x=>!seen.has(String(x.id))));
  fresh=fresh.slice(0,Math.min(batchSize,fresh.length));

  fresh.forEach(x=>seen.add(String(x.id)));

  let items=fresh.map(x=>({...x,_repeat:false}));

  if(!items.length){
    items=shuffle(pool.filter(x=>repeat.has(String(x.id))))
      .slice(0,batchSize)
      .map(x=>({...x,_repeat:true}));
  }

  if(!items.length){
    alert('この日の問題はすべてマスターしました！');
    quizMenu();
    return;
  }

  qp.seen=[...seen];
  state.quizProgress[day]=qp;

  currentSession={
    id:Date.now(),
    day,
    mode,
    timer,
    batchSize,
    items,
    i:0,
    score:0,
    left:timer,
    answers:[]
  };

  state.active=currentSession;
  save();
  quiz();
}
 const d=Number($('day').value),pool=shuffle(dayData(d));if(!pool.length){alert('Day ini belum memiliki kosakata.');return;}
 const n=Math.min(Number($('num').value),pool.length);currentSession={id:Date.now(),day:d,mode:$('mode').value,timer:Number($('timer').value),items:pool.slice(0,n),i:0,score:0,left:Number($('timer').value),answers:[]};state.active=currentSession;save();quiz();
}
function quiz(){
 if(!currentSession){home();return}const s=currentSession;if(s.i>=s.items.length){finish();return}
 const q=s.items[s.i];let m=s.mode;if(m==='mix')m=shuffle(['kr','rk','km'])[0];
 const prompt=m==='rk'?q.reading:q.kanji;const correct=m==='kr'?q.reading:m==='rk'?q.kanji:q.meaning;
 const vals=dayData(s.day).map(x=>m==='kr'?x.reading:m==='rk'?x.kanji:x.meaning);const opts=options(correct,vals);const saved=!!state.savedCards[q.id];
 $('app').innerHTML=`<div class="card"><div class="row between"><span class="pill">Day ${s.day} · ${s.i+1}/${s.items.length}</span><span class="pill">⏱ <b id="clock">${s.left}</b>s</span></div>
 <div class="bar"><div style="width:${(s.i/s.items.length)*100}%"></div></div><div class="big">${esc(prompt)}</div><div class="sub muted">${m==='kr'?'Pilih bacaan':m==='rk'?'Pilih Kanji':'Pilih arti'}</div>
 <div class="answers" id="answers">${opts.map((o,j)=>`<button class="ans" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div>
 <div id="feedback" class="feedback"></div><div class="row between" style="margin-top:14px"><button class="btn" id="saveQuiz">💾 Simpan Progress</button><button class="btn ${saved?'saved':''}" id="saveCard">${saved?'★ Tersimpan':'☆ Simpan Kartu'}</button><button class="btn danger" id="exitQuiz">Keluar</button></div></div>`;
 $('answers').addEventListener('click',e=>{const b=e.target.closest('[data-answer]');if(b)answer(b.dataset.answer,correct);});
 $('saveQuiz').addEventListener('click',()=>{state.active=currentSession;save();notice('Progress quiz sudah disimpan di perangkat ini.');});
 $('saveCard').addEventListener('click',()=>toggleSaved(q));$('exitQuiz').addEventListener('click',quitQuiz);
 clearInterval(quizTimer);quizTimer=setInterval(()=>{if(!currentSession)return;currentSession.left--;const c=$('clock');if(c)c.textContent=currentSession.left;if(currentSession.left<=0)answer(null,correct);},1000);
}
function answer(value,correct){
  if(!currentSession)return;

  const s=currentSession;
  const item=s.items[s.i];
  const ok=value!==null && value===correct;
  const day=s.day;

  const qp=state.quizProgress[day]||{seen:[],repeat:[]};
  const rep=new Set(qp.repeat||[]);

  if(ok){
    s.score++;
    rep.delete(String(item.id));
  }else{
    rep.add(String(item.id));
  }

  qp.repeat=[...rep];
  state.quizProgress[day]=qp;

  s.answers.push({
    id:item.id,
    correct:ok,
    repeat:item._repeat||false
  });

  save();

  s.i++;

  if(s.i>=s.items.length){
    finish();
  }else{
    s.left=s.timer;
    quiz();
  }
}
function finish(){clearInterval(quizTimer);const s=currentSession;state.completed[s.id]={day:s.day,score:s.score,total:s.items.length,date:new Date().toISOString()};delete state.active;save();currentSession=null;$('app').innerHTML=`<div class="card"><h2>Quiz Selesai 🎉</h2><div class="big">${s.score}/${s.items.length}</div><p class="sub">Day ${s.day}</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Kembali ke Quiz</button><button class="btn" id="flashSaved">Kartu Tersimpan</button></div></div>`;$('again').addEventListener('click',home);$('flashSaved').addEventListener('click',savedCards);}
function quitQuiz(){clearInterval(quizTimer);if(currentSession){state.active=currentSession;save();}currentSession=null;home();notice('Progress tersimpan. Kamu bisa melanjutkannya dari menu Quiz.');}
function notice(t){const n=document.createElement('div');n.className='notice';n.textContent=t;$('app').prepend(n);setTimeout(()=>n.remove(),2500);}
function toggleSaved(q){const k=String(q.id);if(state.savedCards[k])delete state.savedCards[k];else state.savedCards[k]=true;save();if(currentSession)quiz();else flash();}
function savedCards(){flashDay='saved';flashIndex=0;flashFlipped=false;flash();}
function flash(){
 const days=[...Array(35)].map((_,i)=>i+1);let rows=flashDay==='saved'?all().filter(q=>state.savedCards[String(q.id)]):dayData(flashDay);if(!rows.length){$('app').innerHTML=`<div class="card empty"><h2>${flashDay==='saved'?'Belum ada kartu tersimpan':'Tidak ada kosakata'}</h2><button class="btn" id="backFlash">Kembali</button></div>`;$('backFlash').addEventListener('click',()=>{flashDay=1;flashIndex=0;flash();});return;}if(flashIndex>=rows.length)flashIndex=rows.length-1;const q=rows[flashIndex];
 $('app').innerHTML=`<div class="card"><h2>Flashcards</h2><div class="grid"><div><label class="label">Day</label><select id="flashDay" class="field"><option value="saved">★ Kartu Tersimpan</option>${days.map(d=>`<option value="${d}" ${d===flashDay?'selected':''}>Day ${d}</option>`).join('')}</select></div></div></div>
 <div class="card"><div class="flash-wrap"><div class="flash ${flashFlipped?'flipped':''}" id="flashCard"><div class="flash-face flash-front"><div><div class="big">${esc(q.kanji)}</div><div class="muted">Tap kartu untuk membalik</div></div></div><div class="flash-face flash-back"><div><div class="sub">${esc(q.reading)}</div><div class="sub">${esc(q.meaning)}</div><div class="muted">Tap kartu untuk kembali</div></div></div></div></div>
 <div class="flash-nav"><button class="btn" id="prev">← Back</button><span>${flashIndex+1}/${rows.length}</span><button class="btn" id="next">Next →</button></div>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ${state.savedCards[String(q.id)]?'saved':''}" id="saveFlash">${state.savedCards[String(q.id)]?'★ Tersimpan':'☆ Simpan Kartu'}</button></div></div>`;
 $('flashDay').addEventListener('change',e=>{flashDay=e.target.value==='saved'?'saved':Number(e.target.value);flashIndex=0;flashFlipped=false;flash();});$('flashCard').addEventListener('click',()=>{flashFlipped=!flashFlipped;const c=$('flashCard');c.classList.toggle('flipped',flashFlipped);});$('prev').addEventListener('click',()=>{flashIndex=(flashIndex-1+rows.length)%rows.length;flashFlipped=false;flash();});$('next').addEventListener('click',()=>{flashIndex=(flashIndex+1)%rows.length;flashFlipped=false;flash();});$('saveFlash').addEventListener('click',()=>toggleSaved(q));
}
function list(){const d=listDay;$('app').innerHTML=`<div class="card"><h2>Search & Kanji List</h2><div class="grid"><div><label class="label">Day</label><select id="listDay" class="field">${[...Array(35)].map((_,i)=>`<option ${i+1===d?'selected':''}>${i+1}</option>`).join('')}</select></div><div><label class="label">Search</label><input id="search" class="field" placeholder="Kanji / reading / meaning"></div></div></div><div class="card"><div id="table"></div></div>`;$('listDay').addEventListener('change',e=>{listDay=Number(e.target.value);list();});$('search').addEventListener('input',renderTable);renderTable();}
function renderTable(){const q=($('search')?.value||'').toLowerCase();const rows=dayData(listDay).filter(x=>(x.kanji+x.reading+x.meaning).toLowerCase().includes(q));$('table').innerHTML=`<div class="tablewrap"><table class="table"><tr><th>No.</th><th>Kanji</th><th>Reading</th><th>Meaning</th></tr>${rows.map(x=>`<tr><td>${x.no}</td><td>${esc(x.kanji)}</td><td>${esc(x.reading)}</td><td>${esc(x.meaning)}</td></tr>`).join('')}</table></div>`;}
function manage(){$('app').innerHTML=`<div class="card"><h2>Database & Progress</h2><p>Total built-in: <b>${DATA.length}</b></p><p>Custom: <b>${state.custom.length}</b></p><p>Quiz selesai: <b>${Object.keys(state.completed).length}</b></p><p>Kartu tersimpan: <b>${Object.keys(state.savedCards).length}</b></p><input id="file" type="file" accept=".csv,.txt" class="field"><button class="btn primary" id="import" style="margin-top:10px">Import CSV</button><button class="btn danger" id="clearCustom" style="margin-top:10px">Hapus data import</button><hr><button class="btn" id="clearProgress">Hapus progress quiz</button><button class="btn" id="clearSaved">Hapus semua kartu tersimpan</button></div>`;$('import').addEventListener('click',importCSV);$('clearCustom').addEventListener('click',()=>{if(confirm('Hapus semua data import?')){state.custom=[];save();manage();}});$('clearProgress').addEventListener('click',()=>{if(confirm('Hapus semua progress quiz?')){state.completed={};delete state.active;save();manage();}});$('clearSaved').addEventListener('click',()=>{if(confirm('Hapus semua kartu tersimpan?')){state.savedCards={};save();manage();}});}
function importCSV(){const f=$('file').files[0];if(!f)return alert('Pilih file CSV.');const r=new FileReader();r.onload=()=>{const lines=String(r.result).split(/\r?\n/).filter(Boolean);let added=0;for(const line of lines.slice(1)){const p=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(p.length>=3){const idx=DATA.length+state.custom.length;state.custom.push({id:'custom-'+Date.now()+'-'+added,day:Math.floor(idx/100)+1,no:idx%100+1,kanji:p[0],reading:p[1],meaning:p.slice(2).join(',')});added++;}}save();alert(added+' entries imported.');setCount();manage();};r.readAsText(f);}
setCount();home();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
