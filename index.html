<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="manifest" href="manifest.webmanifest"><title>KUIS N2</title>
<style>
:root{--bg:#fff8f4;--card:#fff;--ink:#26313d;--muted:#7b8792;--pink:#ef8fa8;--pink2:#f7c9d4;--blue:#8bb9d8;--blue2:#dcecf6;--green:#7db89a;--cream:#fff1dc;--line:#eee4df;--shadow:0 12px 30px rgba(76,54,55,.08);--radius:22px}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff8f4 0%,#f8fbfd 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-tap-highlight-color:transparent}button{font:inherit}button:focus-visible{outline:3px solid #9fcbe5;outline-offset:2px}.app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:88px}.page{padding:18px 16px 24px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#fce5ea,#e7f3fa);border-radius:28px;padding:22px 20px 20px;box-shadow:var(--shadow);margin-bottom:16px}.hero:after{content:'🌸';position:absolute;right:18px;top:10px;font-size:54px;opacity:.55}.hero h1{margin:0;font-size:27px;letter-spacing:.04em}.hero p{margin:7px 0 0;color:#687583;font-size:13px}.fuji{margin:18px -20px -20px;height:60px;background:linear-gradient(180deg,transparent 0 10%,#a8c7d9 11% 55%,#8eb1c6 56%);clip-path:polygon(0 100%,28% 45%,43% 67%,61% 15%,76% 61%,100% 28%,100% 100%)}
.greeting{font-size:14px;color:var(--muted);margin:6px 3px 12px}.progress-card,.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.progress-row{display:flex;justify-content:space-between;align-items:end}.progress-row strong{font-size:25px}.progress-row span{font-size:12px;color:var(--muted)}.bar{height:9px;background:#f0e8e5;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--blue));border-radius:inherit;transition:width .3s}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.action{border:1px solid var(--line);background:#fff;border-radius:20px;padding:17px;text-align:left;min-height:108px;box-shadow:var(--shadow);cursor:pointer}.action .ico{font-size:26px}.action b{display:block;margin-top:9px;font-size:15px}.action small{display:block;color:var(--muted);margin-top:3px}.quote{margin-top:14px;padding:16px 18px;border-radius:18px;background:var(--cream);font-weight:700;color:#6e5c48;text-align:center}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back,.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer}.top h2{margin:0;font-size:20px}.sub{font-size:12px;color:var(--muted);margin:-7px 0 14px 2px}.section-title{font-size:13px;font-weight:800;margin:18px 2px 9px;color:#5e6973}.day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.day{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 3px;cursor:pointer;text-align:center}.day b{display:block}.day small{color:var(--muted);font-size:9px}.mode-grid{display:grid;gap:9px}.choice{border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px;text-align:left;cursor:pointer}.choice.active{border-color:var(--pink);background:#fff0f4}.startbtn,.primary{width:100%;border:0;border-radius:16px;padding:14px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}.secondary{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff;cursor:pointer;font-weight:700}.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 10px;font-size:12px}.timer{font-variant-numeric:tabular-nums}.quiz-card{background:#fff;border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow);padding:24px 18px}.qmeta{text-align:center;color:var(--muted);font-size:12px}.prompt{text-align:center;font-size:42px;font-weight:800;margin:22px 5px;line-height:1.3;word-break:break-word}.prompt.meaning{font-size:24px}.answers{display:grid;gap:10px}.answer{border:1px solid #e7e1de;background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer;min-height:52px}.answer:active{transform:scale(.99)}.quiz-tools{display:flex;gap:9px;margin-top:12px}.quiz-tools button{flex:1}.result{margin-top:30px;text-align:center}.score{font-size:54px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{font-size:20px;display:block}.stat small{color:var(--muted)}.list-search{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px;margin-bottom:10px}.word{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}.word b{font-size:20px}.word small{display:block;color:var(--muted);margin-top:2px}.word .meaning{text-align:right;font-size:13px;max-width:45%}.flash-wrap{perspective:1000px}.flash-card{height:430px;position:relative;transform-style:preserve-3d;transition:transform .45s;cursor:pointer;touch-action:pan-y}.flash-card.flipped{transform:rotateY(180deg)}.flash-face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}.flash-face.back{transform:rotateY(180deg)}.flash-kanji{font-size:78px;font-weight:900}.flash-reading{font-size:24px;margin-top:12px;color:#697580}.flash-meaning{font-size:25px;font-weight:800}.swipe-hint{text-align:center;color:var(--muted);font-size:12px;margin:11px 0}.flash-controls{display:flex;gap:10px}.flash-controls button{flex:1}.manage-grid{display:grid;gap:10px}.stat-card{padding:16px;background:#fff;border:1px solid var(--line);border-radius:18px}.stat-card strong{font-size:28px}.bottom{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:transparent;color:#87919a;padding:7px 2px;cursor:pointer;font-size:11px}.nav span{display:block;font-size:20px;line-height:20px}.nav.active{color:#d46f89;font-weight:800}.empty{padding:30px 10px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#26313d;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;z-index:30;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.saved{color:#d46f89}.danger{color:#b75b5b}
@media(max-width:380px){.day-grid{grid-template-columns:repeat(4,1fr)}.flash-card{height:390px}.prompt{font-size:36px}}
</style></head>
<body><main id="app" class="app"></main><div id="toast" class="toast"></div>
<script src="data.js"></script><script>
(()=>{
'use strict';
const DATA=window.KANJI_DATA||[],STORE='kuisN2_clean_v1',APP=document.getElementById('app');
const $=id=>document.getElementById(id), all=()=>DATA, dayData=d=>all().filter(x=>x.day===Number(d));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>[...a].sort(()=>Math.random()-.5); const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
let state={seen:{},repeat:{},sessions:[],active:null,saved:{}}; try{state={...state,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){}
let session=null,timerId=null,flash={day:1,index:0,flipped:false};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}
function progressCount(){return Object.values(state.seen||{}).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0)}
function nav(active){return `<nav class="bottom"><button class="nav ${active==='home'?'active':''}" data-nav="home"><span>⌂</span>Home</button><button class="nav ${active==='quiz'?'active':''}" data-nav="quiz"><span>✎</span>Quiz</button><button class="nav ${active==='flash'?'active':''}" data-nav="flash"><span>◈</span>Flash</button><button class="nav ${active==='list'?'active':''}" data-nav="list"><span>▤</span>単語</button></nav>`}
function shell(content,active){APP.innerHTML=content+nav(active); APP.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav))}
function home(){const p=progressCount(),pct=Math.min(100,p/DATA.length*100),days=Math.min(35,Math.floor(p/100)+1); shell(`<div class="page"><section class="hero"><h1>KUIS N2</h1><p>JLPT N2 Vocabulary · 35 Days</p><div class="fuji"></div></section><div class="greeting">こんにちは 👋 今日は Day ${days} を進めよう。</div><section class="progress-card"><div class="progress-row"><div><span>学習進捗</span><strong>${p} / ${DATA.length}</strong></div><span>${pct.toFixed(1)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></section><div class="actions"><button class="action" id="goQuiz"><div class="ico">📝</div><b>今日のクイズ</b><small>10問からスタート</small></button><button class="action" id="goFlash"><div class="ico">🃏</div><b>フラッシュカード</b><small>タップ・スワイプ</small></button><button class="action" id="goList"><div class="ico">📚</div><b>単語一覧</b><small>Dayごとに確認</small></button><button class="action" id="goProgress"><div class="ico">📈</div><b>進捗</b><small>学習記録を見る</small></button></div><div class="quote">「継続は力なり」</div></div>`,'home'); $('goQuiz').onclick=()=>quizMenu();$('goFlash').onclick=()=>flashView();$('goList').onclick=()=>listView();$('goProgress').onclick=()=>progressView()}
function top(title,back=true){return `<div class="top">${back?'<button class="back" id="back">‹</button>':''}<h2>${title}</h2></div>`}
function quizMenu(){shell(`<div class="page">${top('Quiz')}<div class="sub">Pilih hari, mode, dan jumlah soal.</div><div class="section-title">Hari</div><div class="day-grid">${Array.from({length:35},(_,i)=>`<button class="day" data-day="${i+1}"><b>${i+1}</b><small>${dayData(i+1).length} kata</small></button>`).join('')}</div><div class="section-title">Mode</div><div class="mode-grid"><button class="choice active" data-mode="kr"><b>Kanji → Reading</b><small>Pilih cara baca</small></button><button class="choice" data-mode="rk"><b>Reading → Kanji</b><small>Pilih kanji</small></button><button class="choice" data-mode="km"><b>Kanji → Arti</b><small>Pilih arti Indonesia</small></button><button class="choice" data-mode="mix"><b>Mix</b><small>Campuran</small></button></div><div class="section-title">Timer</div><div class="mode-grid"><button class="choice active" data-time="20">20 detik / soal</button><button class="choice" data-time="30">30 detik / soal</button><button class="choice" data-time="60">60 detik / soal</button></div><div class="section-title">Jumlah soal</div><div class="mode-grid"><button class="choice active" data-count="10">10 soal</button><button class="choice" data-count="20">20 soal</button><button class="choice" data-count="50">50 soal</button></div><br><button class="startbtn" id="startQuiz">Mulai Quiz →</button></div>`,'quiz');let day=1,mode='kr',time=20,count=10;APP.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;APP.querySelectorAll('[data-day]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});APP.querySelector('[data-day="1"]').classList.add('active');[['mode',()=>mode],['time',()=>time],['count',()=>count]].forEach(([kind,get])=>APP.querySelectorAll(`[data-${kind}]`).forEach(b=>b.onclick=()=>{if(kind==='mode')mode=b.dataset.mode;if(kind==='time')time=+b.dataset.time;if(kind==='count')count=+b.dataset.count;APP.querySelectorAll(`[data-${kind}]`).forEach(x=>x.classList.remove('active'));b.classList.add('active')}));$('startQuiz').onclick=()=>startQuiz(day,mode,time,count);$('back').onclick=home}
function buildItems(day,count){const seen=new Set((state.seen[day]||[]).map(String)),rep=new Set((state.repeat[day]||[]).map(String));const fresh=shuffle(dayData(day).filter(x=>!seen.has(String(x.id)))).slice(0,count);fresh.forEach(x=>seen.add(String(x.id)));let items=fresh.map(x=>({...x,_repeat:false}));if(!items.length)items=shuffle(dayData(day).filter(x=>rep.has(String(x.id)))).slice(0,count).map(x=>({...x,_repeat:true}));state.seen[day]=[...seen];save();return items}
function startQuiz(day,mode,time,count){const items=buildItems(day,count);if(!items.length){toast('Day ini sudah selesai 🎉');return}session={day,mode,time,count,items,i:0,score:0,answers:[],left:time,locked:false};state.active=session;save();renderQuestion()}
function renderQuestion(){clearInterval(timerId);if(!session)return;if(session.i>=session.items.length){finish();return}const q=session.items[session.i];let mode=session.mode;if(mode==='mix')mode=shuffle(['kr','rk','km'])[0];session.currentMode=mode;const correct=mode==='kr'?q.reading:mode==='rk'?q.kanji:q.meaning;const pool=dayData(session.day).map(x=>mode==='kr'?x.reading:mode==='rk'?x.kanji:x.meaning);const opts=shuffle([correct,...shuffle([...new Set(pool.filter(x=>x!==correct))]).slice(0,3)]);const prompt=mode==='rk'?q.reading:mode==='km'?q.kanji:q.kanji;APP.innerHTML=`<div class="page"><div class="quiz-head"><span class="pill">Day ${session.day} · ${session.i+1}/${session.items.length}</span><span class="pill timer">⏱ <b id="clock">${session.left}</b>s</span></div><div class="bar"><i style="width:${session.i/session.items.length*100}%"></i></div><br><section class="quiz-card"><div class="qmeta">${mode==='kr'?'読み方は？':mode==='rk'?'漢字は？':'意味は？'}</div><div class="prompt ${mode==='km'?'meaning':''}">${esc(prompt)}</div><div class="answers" id="answers">${opts.map(o=>`<button class="answer" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="quiz-tools"><button class="secondary" id="saveQ">💾 保存</button><button class="secondary" id="exitQ">終了</button></div></section></div>`; $('answers').onclick=e=>{const b=e.target.closest('[data-answer]');if(b)answer(b.dataset.answer,correct)};$('saveQ').onclick=()=>{state.active=session;save();toast('Progress disimpan di perangkat');};$('exitQ').onclick=()=>{if(confirm('Keluar dari quiz? Progress soal saat ini tetap tersimpan.')){clearInterval(timerId);quizMenu()}};timerId=setInterval(()=>{if(!session)return;session.left--;const c=$('clock');if(c)c.textContent=session.left;if(session.left<=0)answer(null,correct)},1000)}
function answer(value,correct){if(!session||session.locked)return;session.locked=true;clearInterval(timerId);const q=session.items[session.i],ok=value!==null&&value===correct;const rep=new Set((state.repeat[session.day]||[]).map(String));if(ok){session.score++;rep.delete(String(q.id))}else rep.add(String(q.id));state.repeat[session.day]=[...rep];session.answers.push({id:q.id,correct:ok});save();const btn=[...APP.querySelectorAll('.answer')].find(b=>b.dataset.answer===value);if(btn)btn.style.borderColor=ok?'#78b997':'#d9899b';setTimeout(()=>{session.i++;session.left=session.time;session.locked=false;state.active=session;save();renderQuestion()},220)}
function finish(){if(!session)return;clearInterval(timerId);const s=session,wrong=s.answers.filter(a=>!a.correct).length;state.sessions.unshift({day:s.day,score:s.score,total:s.items.length,wrong,date:Date.now()});state.sessions=state.sessions.slice(0,100);state.active=null;save();const rep=(state.repeat[s.day]||[]).length;const freshLeft=dayData(s.day).filter(x=>!(state.seen[s.day]||[]).map(String).includes(String(x.id))).length;APP.innerHTML=`<div class="page"><div class="result"><div class="pill">Day ${s.day} selesai</div><h2>お疲れさま！</h2><div class="score">${s.score}/${s.items.length}</div><div class="stats"><div class="stat"><b>${s.score}</b><small>正解</small></div><div class="stat"><b>${wrong}</b><small>不正解</small></div><div class="stat"><b>${rep}</b><small>復習</small></div></div><p style="color:var(--muted);font-size:13px">${freshLeft?freshLeft+' kata baru masih tersedia.':rep?'Ada kata yang perlu diulang.':'Day ini selesai.'}</p><button class="primary" id="next">${freshLeft||rep?'Lanjut latihan':'Kembali ke Quiz'}</button><br><br><button class="secondary" id="menu">Quiz Menu</button></div></div>`;$('next').onclick=()=>freshLeft||rep?startQuiz(s.day,s.mode,s.time,s.count):quizMenu();$('menu').onclick=quizMenu}
function flashView(){const d=flash.day;const data=dayData(d);if(flash.index>=data.length)flash.index=0;const q=data[flash.index];shell(`<div class="page">${top('Flashcard')}<div class="sub">Day ${d} · ${flash.index+1}/${data.length}</div><div class="day-grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px"><button class="day" id="prevDay">← Day</button><button class="day" id="nextDay">Day →</button></div><div class="flash-wrap"><div class="flash-card ${flash.flipped?'flipped':''}" id="fc"><div class="flash-face"><div class="qmeta">KANJI</div><div class="flash-kanji">${esc(q.kanji)}</div><div class="flash-reading">${esc(q.reading)}</div><div class="swipe-hint">Tap untuk membalik</div></div><div class="flash-face back"><div class="qmeta">ARTI</div><div class="flash-meaning">${esc(q.meaning)}</div><div class="flash-reading">${esc(q.reading)}</div><div class="swipe-hint">Geser kiri / kanan untuk pindah</div></div></div></div><div class="swipe-hint">← Geser kiri: berikutnya · kanan: sebelumnya →</div><div class="flash-controls"><button class="secondary" id="prev">← Sebelumnya</button><button class="primary" id="next">Berikutnya →</button></div></div>`,'flash');$('back').onclick=home;$('fc').onclick=()=>{flash.flipped=!flash.flipped;flashView()};$('prev').onclick=()=>flashMove(-1);$('next').onclick=()=>flashMove(1);$('prevDay').onclick=()=>{flash.day=Math.max(1,flash.day-1);flash.index=0;flash.flipped=false;flashView()};$('nextDay').onclick=()=>{flash.day=Math.min(34,flash.day+1);flash.index=0;flash.flipped=false;flashView()};let sx=0,sy=0;const fc=$('fc');fc.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});fc.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){flashMove(dx<0?1:-1)}},{passive:true})}
function flashMove(dir){const n=dayData(flash.day).length;flash.index=(flash.index+dir+n)%n;flash.flipped=false;flashView()}
function listView(){let d=1,query='';const render=()=>{const data=dayData(d).filter(q=>(q.kanji+' '+q.reading+' '+q.meaning).toLowerCase().includes(query.toLowerCase()));shell(`<div class="page">${top('単語一覧')}<div class="sub">Cari kosakata per hari.</div><div class="day-grid" style="grid-template-columns:repeat(6,1fr);margin-bottom:12px">${Array.from({length:34},(_,i)=>`<button class="day ${d===i+1?'active':''}" data-d="${i+1}">${i+1}</button>`).join('')}</div><input class="list-search" id="search" placeholder="Cari kanji, reading, arti..." value="${esc(query)}"><div class="card" style="padding:4px 14px">${data.map(q=>`<div class="word"><div><b>${esc(q.kanji)}</b><small>${esc(q.reading)}</small></div><div class="meaning">${esc(q.meaning)}</div></div>`).join('')||'<div class="empty">Tidak ditemukan.</div>'}</div></div>`,'list');$('back').onclick=home;APP.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{d=+b.dataset.d;render()});$('search').oninput=e=>{query=e.target.value;const words=APP.querySelector('.card');const arr=dayData(d).filter(q=>(q.kanji+' '+q.reading+' '+q.meaning).toLowerCase().includes(query.toLowerCase()));words.innerHTML=arr.map(q=>`<div class="word"><div><b>${esc(q.kanji)}</b><small>${esc(q.reading)}</small></div><div class="meaning">${esc(q.meaning)}</div></div>`).join('')||'<div class="empty">Tidak ditemukan.</div>'}};render()}
function progressView(){const p=progressCount(),sessions=state.sessions||[],correct=sessions.reduce((n,s)=>n+s.score,0),total=sessions.reduce((n,s)=>n+s.total,0);shell(`<div class="page">${top('進捗')}<div class="manage-grid"><div class="stat-card"><small>Vocabulary seen</small><br><strong>${p}</strong> / ${DATA.length}</div><div class="stat-card"><small>Quiz dikerjakan</small><br><strong>${sessions.length}</strong></div><div class="stat-card"><small>Rata-rata jawaban</small><br><strong>${total?Math.round(correct/total*100):0}%</strong></div><button class="secondary danger" id="reset">Reset semua progress</button></div><div class="section-title">Riwayat terbaru</div><div class="card">${sessions.slice(0,12).map(s=>`<div class="word"><div><b>Day ${s.day}</b><small>${new Date(s.date).toLocaleDateString('id-ID')}</small></div><div class="meaning">${s.score}/${s.total}</div></div>`).join('')||'<div class="empty">Belum ada riwayat quiz.</div>'}</div></div>`,'');$('back').onclick=home;$('reset').onclick=()=>{if(confirm('Hapus semua progress di perangkat ini?')){state={seen:{},repeat:{},sessions:[],active:null,saved:{}};save();toast('Progress direset');progressView()}}}
function show(v){clearInterval(timerId);if(v==='home')home();else if(v==='quiz')quizMenu();else if(v==='flash')flashView();else listView()}
if(state.active&&state.active.items){/* keep saved session available without forcing resume */}home();
})();</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}</script></body></html>
