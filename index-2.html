<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f4">
<title>KUIS N2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff8f4;color:#3b3030}main{max-width:720px;margin:auto;padding:24px 18px 40px}.card{background:#fff;border:1px solid #f0dfd8;border-radius:22px;padding:22px;box-shadow:0 8px 30px rgba(90,50,40,.07);margin-top:16px}h1{margin:0;font-size:32px}h2{margin:0 0 8px}.sub{color:#806f69;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.btn{display:block;width:100%;padding:15px;border:0;border-radius:16px;background:#f5e5df;color:#4b3832;font-size:16px;font-weight:700;cursor:pointer}.btn:active{transform:scale(.98)}#status{font-size:14px;line-height:1.6;color:#655751}.ok{color:#28734b;font-weight:700}.warn{color:#a05b24;font-weight:700}@media(max-width:480px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>🎌 KUIS N2</h1>
    <div class="sub">JLPT N2 Vocabulary</div>
    <p id="status">Memeriksa database...</p>
    <div class="grid">
      <button class="btn" onclick="alert('Quiz akan diaktifkan setelah tampilan dasar ini dikonfirmasi.')">📝 Quiz</button>
      <button class="btn" onclick="alert('Flashcard akan diaktifkan setelah tampilan dasar ini dikonfirmasi.')">🃏 Flashcard</button>
      <button class="btn" onclick="alert('Database akan diaktifkan setelah tampilan dasar ini dikonfirmasi.')">📚 Database</button>
      <button class="btn" onclick="alert('Progress akan diaktifkan setelah tampilan dasar ini dikonfirmasi.')">📊 Progress</button>
    </div>
  </div>
</main>
<script>
(function(){
  var n=Array.isArray(window.KANJI_DATA)?window.KANJI_DATA.length:0;
  var el=document.getElementById('status');
  if(n>0){el.innerHTML='<span class="ok">✓ Halaman berhasil dimuat.</span><br>Database terdeteksi: <b>'+n.toLocaleString('id-ID')+'</b> kosakata.<br><small>Versi Safe Start — belum menyentuh Quiz/Flashcard.</small>';}
  else{el.innerHTML='<span class="warn">⚠ Halaman berhasil dimuat, tetapi data.js belum terbaca.</span><br>Pastikan <b>data.js</b> ada di folder yang sama dengan index.html.';}
})();
</script>
</body>
</html>
